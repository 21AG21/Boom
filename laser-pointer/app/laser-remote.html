<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Laser Remote</title>
<!--
  Laser Remote — Web Bluetooth on/off control
  ------------------------------------------------------------------
  Talks to the LASER-PT firmware over BLE (Nordic UART Service). Open
  this file in a browser and hit Connect, then tap the big button to
  turn the laser on/off. Nothing to install.

  Works in: Chrome / Edge on a laptop/desktop (Win/Mac/Linux) and Chrome
  on Android. Web Bluetooth is NOT supported by Safari / iOS Chrome — on
  an iPhone/iPad use the free "Bluefy" browser app instead, or the nRF
  Connect app with the commands in the firmware header.

  The device's physical button also toggles the laser; when it does, this
  page updates to match (it listens for the firmware's on/off messages).
-->
<style>
 :root{ --bg:#0f1115; --fg:#e8eaed; --accent:#2f6db4; --line:#2a2f3a;
        --hot:#e03131; --ok:#2f9e44; }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;flex-direction:column;align-items:center;gap:22px;
      padding:28px 16px;min-height:100vh;touch-action:manipulation}
 h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.02em}
 #status{font-size:13px;color:#9aa0aa;min-height:18px}
 #status.on{color:var(--ok)}
 #connect{font-size:16px;padding:14px 22px;border-radius:12px;border:0;
          background:var(--accent);color:var(--fg);font-weight:600;cursor:pointer;
          width:min(86vw,320px)}
 #connect.connected{background:#242833}
 #connect:active{transform:translateY(1px)}
 #power{width:min(66vw,230px);aspect-ratio:1;border-radius:50%;cursor:pointer;
        background:#242833;border:3px solid var(--line);color:var(--fg);
        font-size:26px;font-weight:700;display:flex;align-items:center;
        justify-content:center;flex-direction:column;gap:8px}
 #power:disabled{opacity:.4;cursor:default}
 #power.on{background:var(--hot);border-color:#ff6b6b;
           box-shadow:0 0 46px rgba(224,49,49,.55)}
 #power .sub{font-size:13px;font-weight:500;opacity:.85}
 #power:active:not(:disabled){transform:translateY(1px)}
 .hint{font-size:12px;color:#7a808c;max-width:340px;text-align:center;line-height:1.5}
 code{background:#242833;padding:1px 5px;border-radius:4px}
</style>

<h1>Laser Remote</h1>
<div id="status">Not connected</div>
<button id="connect">Connect</button>

<button id="power" disabled><span id="plabel">OFF</span><span class="sub">tap to toggle</span></button>

<div class="hint">
  Aim the gadget itself where you want the dot. On a laptop use Chrome or
  Edge; on Android use Chrome; on iPhone use the <code>Bluefy</code>
  browser. The device's own button toggles it too.
</div>

<script>
const NUS    = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";  // write  (app -> device)
const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";  // notify (device -> app)

let rxChar = null, device = null, isOn = false;

const $ = s => document.querySelector(s);
const statusEl = $("#status"), power = $("#power"), plabel = $("#plabel");

function setStatus(t, ok=false){ statusEl.textContent = t; statusEl.classList.toggle("on", ok); }

function reflect(on){
  isOn = on;
  power.classList.toggle("on", on);
  plabel.textContent = on ? "ON" : "OFF";
}

async function connect(){
  if (!navigator.bluetooth){ setStatus("Web Bluetooth not available in this browser"); return; }
  try{
    setStatus("Scanning…");
    device = await navigator.bluetooth.requestDevice({
      filters:[{ name:"LASER-PT" }, { services:[NUS] }],
      optionalServices:[NUS]
    });
    device.addEventListener("gattserverdisconnected", onDisconnect);
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rxChar = await svc.getCharacteristic(NUS_RX);
    // listen so the button on the device keeps this page in sync
    try{
      const tx = await svc.getCharacteristic(NUS_TX);
      await tx.startNotifications();
      tx.addEventListener("characteristicvaluechanged", e=>{
        const msg = new TextDecoder().decode(e.target.value).trim();
        if (msg === "on")  reflect(true);
        if (msg === "off") reflect(false);
      });
    }catch(_){}
    setStatus("Connected to " + device.name, true);
    $("#connect").textContent = "Disconnect";
    $("#connect").classList.add("connected");
    power.disabled = false;
  }catch(err){ setStatus("Connect cancelled / failed"); }
}

function onDisconnect(){
  rxChar = null;
  setStatus("Disconnected");
  $("#connect").textContent = "Connect";
  $("#connect").classList.remove("connected");
  power.disabled = true;
  reflect(false);
}

async function send(cmd){
  if (!rxChar) return;
  try{ await rxChar.writeValue(new TextEncoder().encode(cmd + "\n")); }
  catch(_){}
}

$("#connect").onclick = ()=>{ (device?.gatt?.connected) ? device.gatt.disconnect() : connect(); };
power.onclick = ()=>{ const next = !isOn; reflect(next); send(next ? "L1" : "L0"); };
</script>
</html>
